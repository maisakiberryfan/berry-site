name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.dev.vars'
      - 'wrangler.toml'

# 同一 stack 不可有兩個 sam deploy 併行：CloudFormation 對 UPDATE_IN_PROGRESS 的 stack
# 直接拒絕新 changeset（部署紅字），S3 sync 交錯更可能讓 bucket 停在兩次 build 的混合狀態。
# history-bot（VPS cron 04:30 push history.md）與人工 commit 相繼落地就是典型觸發情境。
# cancel-in-progress: false —— 部署跑到一半被取消會留下半同步的 S3／未完成的 changeset，
# 排隊等前一次做完才是安全的收斂方式（AWS 側刻意與 CF 側相反）。
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  SAM_CLI_TELEMETRY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install dependencies and make esbuild available on PATH
      - run: |
          npm ci
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # Build Lambda
      - run: sam build

      # Deploy Lambda + API Gateway + CloudFront
      # DiscordSetlistWebhookUrl 已於 2026-05-02 移轉至 yt-setlist-discord，故不傳入
      # ⚠️ --parameter-overrides 的續行序列中絕不可插入 `#` 註解：shell 會在該行結束續行，
      #    其後的參數變成獨立賦值語句、靜默不送出，SAM 對未 override 的參數則沿用 stack 現值
      # ⚠️ 值一律先經 `env:` 映射成環境變數，再以 "Key=\"$VAR\"" 的形式傳遞，兩層引號各有職責：
      #    外層是**真引號**（shell 解析掉）——值含空白時直接內插 ${{ secrets.X }} 會被
      #      word splitting 拆成多個參數，其後整串 Key=Value 全部錯位、靜默送錯值；
      #    內層 \" 是**字面引號**（原樣送進 SAM）——SAM CLI 的 --parameter-overrides 解析器
      #      不接受未加引號的空值（`Key=` 會整個部署失敗），secrets 未設定時必須安全地落成
      #      `Key=""`＝空字串（快照 cron skip／origin 驗證停用）。實測 SAM CLI 1.151.0 行為
      - name: Deploy SAM stack
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          LAMBDA_MATCHER_URL: ${{ secrets.LAMBDA_MATCHER_URL }}
          PUBSUB_CALLBACK_URL: ${{ secrets.PUBSUB_CALLBACK_URL }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          SNAPSHOT_BUCKET_A: ${{ secrets.SNAPSHOT_BUCKET_A }}
          SNAPSHOT_DISTRIBUTION_A: ${{ secrets.SNAPSHOT_DISTRIBUTION_A }}
          SNAPSHOT_BUCKET_B: ${{ secrets.SNAPSHOT_BUCKET_B }}
          SNAPSHOT_DISTRIBUTION_B: ${{ secrets.SNAPSHOT_DISTRIBUTION_B }}
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          # ── 必填檢核 ──────────────────────────────────────────────────────
          # 只針對「template.yaml 有**有意義的 Default**、而空值會靜默蓋掉它」的參數。
          # secret 被刪／改名／打錯字時，下面的 Key="" 會把 Default 覆寫成空字串：
          #   DbPort 空          → platform.js 的 parseInt('') = NaN → DB 全滅（全站 API 500）
          #   LambdaMatcherUrl 空 → 歌單解析靜默失敗（沒人盯，過幾天才發現資料沒進來）
          # 兩者都屬於「壞掉但不吵」的失敗模式，故改成部署當場失敗（吵）。
          # 其餘參數（Discord/Github/Pubsub/Snapshot*/OriginVerify）的 Default 本來就是 ''，
          # 留白＝該功能停用是合法狀態，不檢核。
          : "${DB_PORT:?secret 未設或為空 —— 會覆蓋 template 的 Default 3306，DB 將連不上}"
          : "${LAMBDA_MATCHER_URL:?secret 未設或為空 —— 會覆蓋 template 的 Default URL，歌單解析將失效}"

          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-site \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "DbHost=\"$DB_HOST\"" \
              "DbPort=\"$DB_PORT\"" \
              "DbUser=\"$DB_USER\"" \
              "DbPassword=\"$DB_PASSWORD\"" \
              "DbName=\"$DB_NAME\"" \
              "YoutubeApiKey=\"$YOUTUBE_API_KEY\"" \
              "DiscordWebhookUrl=\"$DISCORD_WEBHOOK_URL\"" \
              "TriggerToken=\"$TRIGGER_TOKEN\"" \
              "LambdaMatcherUrl=\"$LAMBDA_MATCHER_URL\"" \
              "PubsubCallbackUrl=\"$PUBSUB_CALLBACK_URL\"" \
              "GithubToken=\"$GH_PAT_TOKEN\"" \
              "SnapshotBucketA=\"$SNAPSHOT_BUCKET_A\"" \
              "SnapshotDistributionA=\"$SNAPSHOT_DISTRIBUTION_A\"" \
              "SnapshotBucketB=\"$SNAPSHOT_BUCKET_B\"" \
              "SnapshotDistributionB=\"$SNAPSHOT_DISTRIBUTION_B\"" \
              "OriginVerifySecret=\"$ORIGIN_VERIFY_SECRET\""

      # Get S3 bucket name and CloudFront distribution ID from stack outputs
      - name: Get stack outputs
        id: stack
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`FansiteBucketName`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"
          echo "cf_dist=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"

      # ── fansite-v2（v3 站）build → dist/ ──────────────────────────────────
      - name: Install fansite-v2 deps
        working-directory: fansite-v2
        run: npm ci

      # CDN 靜態快照（fansite-v2/public/data/*.json）：首訪三層瀑布的第二層。
      # 刻意排在 sam deploy 之後、Vite build 之前：部署後才抓＝快照與新版 API 的
      # 輸出格式一致；build 前抓＝Vite 把 public/ 連同 data/ 一起拷進 dist/。
      # continue-on-error——抓不完整就跳過下面的快照同步，S3 上既有的舊快照原地保留；
      # 快照過時只是首訪多校正幾個月份，擋住整個部署才是更糟的失敗模式
      - name: Snapshot data (best-effort)
        id: snapshot
        working-directory: fansite-v2
        continue-on-error: true
        run: npm run snapshot

      # history.md／changelog.json 用 repo 版覆蓋快照抓來的線上版：
      # 上一步是從 https://m-b.win 抓的，而此刻線上仍是「上一次部署」的內容
      # （本次的 S3 同步在下面才發生）→ 不覆蓋的話 /data/ 副本永遠落後一次部署，
      # 這兩支又是「這次 commit 才改的」機率最高的檔（history-bot／commit skill）。
      # 刻意不掛 snapshot 的 outcome 條件：這步只動 build 輸入，快照要不要上傳
      # 仍由下面的 `if: steps.snapshot.outcome == 'success'` 決定；mkdir -p 讓
      # snapshot 整支炸掉（public/data/ 沒建出來）時這步也不會再炸一次 CI
      # changelog 的 time 一律蓋成本次 commit 的時間（就地改 checkout 內的檔，不 commit
      # 回 repo）：手寫時間戳會過時（2026-08-14 預寫中午值晚上才上線的教訓）。改在
      # overlay 之前＝原位上傳（aws s3 cp）與 /data/ 副本用同一份蓋過的檔，cron 快照
      # 之後從原位抓也拿到正確值，三處一致。msg 內容維持人寫三語（訪客導向），不自動化
      - name: Stamp changelog time from commit
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          node -e "const fs=require('fs');const f='fansite/changelog.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.time=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$COMMIT_TIME"

      - name: Overlay repo history/changelog into snapshot
        run: |
          mkdir -p fansite-v2/public/data
          cp fansite/pages/history.md fansite-v2/public/data/history.md
          cp fansite/changelog.json fansite-v2/public/data/changelog.json

      - name: Build fansite-v2
        working-directory: fansite-v2
        run: npm run build

      # Sync v3 static files to S3
      # ⚠️ 刻意「不」用全域 --delete：
      #   ① hash 資產只增不刪——Vite 內容 hash 檔名，開著舊分頁的使用者 lazy chunk
      #     不會 404；v2 遺產（assets/js|css|dist/）同樣落在保留路徑，
      #     切換觀察期滿後由清理 commit 一次出清（見 plan-v3-switchover）
      #   ② img/、pages/history.md、changelog.json 是 bucket 上必須保留的非 dist 內容
      #     （og:image／history-bot 持續 push／commit skill 更新），--delete 會誤刪
      - name: Sync fansite-v2 to S3
        run: |
          # hash 資產：內容不變 URL 就不變，--size-only 跳過已存在的同 hash 檔
          aws s3 sync fansite-v2/dist/assets/ s3://${{ steps.stack.outputs.bucket }}/assets/ \
            --size-only \
            --cache-control "public, max-age=31536000, immutable"
          # 頂層覆蓋檔（index.html／theme-init.js／favicon.ico）：no-cache 每次 revalidate
          # （304 極快）；不用 --size-only 以免同大小的內容變更被跳過。
          # og/*.html（per-page 分享預覽，generate-og-html.mjs 產）也走這一輪：
          # 它們是 index.html 的變體（BotBlockerFunction 會把 /discography/<id> 這類
          # 路徑 rewrite 過去），快取策略必須與 index.html 一致，否則同一個頁面在
          # 不同入口下的新鮮度會不一樣。**新增 dist 子目錄時記得檢查這兩個 --exclude**
          aws s3 sync fansite-v2/dist/ s3://${{ steps.stack.outputs.bucket }}/ \
            --cache-control "no-cache, must-revalidate" \
            --exclude "assets/*" \
            --exclude "data/*"
          # v2 沿用內容（來源仍在 fansite/，v3 的 og:image 與快照 cron 靜態抓取都依賴）
          # ⚠️ fansite/ 目錄清理時，img/、pages/history.md、changelog.json 三個來源必須先
          #    遷到新位置並改這裡（快照 cron 的 SNAPSHOT_STATIC_BASE 抓的也是後兩支）
          aws s3 sync fansite/img/ s3://${{ steps.stack.outputs.bucket }}/img/ \
            --size-only \
            --cache-control "public, max-age=86400"
          aws s3 cp fansite/pages/history.md s3://${{ steps.stack.outputs.bucket }}/pages/history.md \
            --cache-control "no-cache, must-revalidate"
          aws s3 cp fansite/changelog.json s3://${{ steps.stack.outputs.bucket }}/changelog.json \
            --cache-control "no-cache, must-revalidate"

      # CDN 快照獨立一輪（上一輪已用 --exclude "data/*" 讓開）：
      #   max-age=300  預設值會讓瀏覽器黏住舊快照一整天（CloudFront 端有
      #                invalidation，但瀏覽器沒有）；快照的意義就是「跟得上最近一次部署」
      #   不加 --size-only  月度快照常出現同大小的內容變更（改一個字），只比大小會漏傳
      #   --delete     清掉 manifest 已不存在的舊月份檔（僅限 data/ 前綴，安全）
      - name: Sync CDN snapshot to S3
        if: steps.snapshot.outcome == 'success'
        run: |
          aws s3 sync fansite-v2/dist/data/ s3://${{ steps.stack.outputs.bucket }}/data/ \
            --delete \
            --cache-control "public, max-age=300"

      # ── 孤兒 hash 資產回收（邏輯移植自 fansite-v2/scripts/deploy-sync.sh 步驟 4）──
      # 上面的 assets/ sync 刻意不帶 --delete（舊 hash chunk 要留給仍開著舊分頁的使用者
      # lazy-load：Analytics 的 QueryPanel、sql.js wasm 一旦 404 整頁就壞），代價是
      # assets/ 前綴只增不減。這步是它的另一半：
      #   刪除條件（**兩者皆需成立**）本地 dist/assets/ 已無同名檔 ∧ LastModified 早於 N 天。
      #   只掃 assets/ 前綴——img/、data/、pages/、index.html 一律碰不到。
      # continue-on-error：檔案此刻都已同步完成，回收失敗不該把部署判紅（下次再收）。
      - name: Reclaim stale hashed assets
        continue-on-error: true
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          RETENTION_DAYS: '14'
        run: |
          [ -d fansite-v2/dist/assets ] || { echo "dist/assets/ 不存在，略過回收"; exit 0; }
          cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%S)"
          # aws cli 會自動分頁 list-objects-v2（botocore paginator），--query 套用在合併後的
          # 完整 Contents 上，1000 筆以上也不會漏——前提是別加 --max-items（加了才會截斷）。
          # --output text 以 tab 分隔，免 jq 依賴。
          listing="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "assets/" \
            --query 'Contents[].[Key,LastModified]' --output text)"
          # 空 prefix 時 aws cli 對 null 會印出 "None"
          if [ -z "$listing" ] || [ "$listing" = "None" ]; then
            echo "bucket assets/ 下無物件，無須回收"
            exit 0
          fi
          # 本地現役 key 清單（key 形式：assets/xxx）
          declare -A local_keys=()
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            local_keys["assets/${rel#./}"]=1
          done < <(cd fansite-v2/dist/assets && find . -type f)
          deleted=0; kept=0; alive=0; scanned=0
          while IFS=$'\t' read -r key lastmod; do
            [ -n "$key" ] || continue
            scanned=$((scanned + 1))
            # 本地仍有＝現役資產，永不刪（連保留窗口都不必看）
            if [ -n "${local_keys[$key]:-}" ]; then
              alive=$((alive + 1))
              continue
            fi
            # ISO8601（同格式、同為 UTC）字典序比較即等同時間比較；
            # 取前 19 字元以吃掉 "+00:00" / "Z" / 小數秒等尾巴差異
            if [[ "${lastmod:0:19}" < "$cutoff" ]]; then
              echo "× 回收 $key（LastModified ${lastmod:0:19} < $cutoff）"
              if aws s3 rm "s3://$BUCKET/$key" > /dev/null; then
                deleted=$((deleted + 1))
              else
                echo "! 刪除 $key 失敗（略過）"
              fi
            else
              kept=$((kept + 1))
            fi
          done <<< "$listing"
          echo "掃描 $scanned 個物件：現役 $alive、保留窗口內 $kept、回收 $deleted"

      # Invalidate CloudFront cache for updated files
      - name: Invalidate CloudFront
        run: |
          # 全路徑 invalidation：1 path/次（免費額度 1000/月），避免再有「新目錄忘了加清單」的遺漏
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist }} \
            --paths "/*"

  # 獨立 SAM stack：歌單模糊比對 Lambda（lambda/setlist-matcher）
  # 只在 matcher 或本 workflow 變更時部署
  deploy-matcher:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect matcher changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # push 事件 before..after 涵蓋整段推送範圍（而非僅 tip commit），
          # 避免多 commit 推送中，中間 commit 改了 matcher 卻因只比對 tip 被跳過部署
          # 注意：對完整 40 碼 hex，plain `--verify` 只驗語法不驗物件是否存在（git 已知行為，
          # 曾實測 deadbeef...×5 這種語法合法但不存在的 SHA 會被判定「verify 成功」）；
          # 需接 ^{commit} 強制檢查物件真實存在，否則 force-push 舊 tip 不可達等情境會漏判
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify -q "${BEFORE_SHA}^{commit}" > /dev/null 2>&1; then
            # before 不可用（新分支／force-push 等邊界情況）：安全預設視為有變更。
            # sam deploy 具冪等性，多部署一次無害；漏部署才是要消除的失敗模式。
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- lambda/setlist-matcher/ .github/workflows/deploy.yml 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'

      # 部署前先跑 matcher 的兩支確定性測試（只讀 production API，不需任何憑證）。
      # 兩支都以 exit code 表態，失敗即擋下部署 —— 比對邏輯壞掉會直接污染 setlist 資料
      - name: Test matcher
        if: steps.changes.outputs.changed == 'true'
        working-directory: lambda/setlist-matcher
        run: |
          npm ci
          node test-fix.mjs
          node test-regression.mjs

      - uses: aws-actions/setup-sam@v2
        if: steps.changes.outputs.changed == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & deploy matcher
        if: steps.changes.outputs.changed == 'true'
        working-directory: lambda/setlist-matcher
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-setlist-matcher \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides BerrySiteApiUrl=https://d36w2d8blmdfr.cloudfront.net FunctionTimeout=29
