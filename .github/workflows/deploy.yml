name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.dev.vars'
      - 'wrangler.toml'

env:
  AWS_REGION: ap-northeast-1
  SAM_CLI_TELEMETRY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install dependencies and make esbuild available on PATH
      - run: |
          npm ci
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # Build fansite JS bundle (CSS is pre-built and committed)
      - name: Build fansite
        working-directory: fansite
        run: |
          npm ci
          npm run build:js

      # Cache-bust：dist 資產引用加 commit hash。index.html 為 no-cache 每次重驗，
      # 新 hash＝新 URL → 瀏覽器立即抓新版（dist 本身 max-age=86400 的快取效益保留）
      - name: Cache-bust asset references
        run: |
          sed -i "s|/assets/dist/tool\.js[^\"]*|/assets/dist/tool.js?v=${GITHUB_SHA::8}|; s|/assets/dist/tool\.css[^\"]*|/assets/dist/tool.css?v=${GITHUB_SHA::8}|" fansite/index.html

      # Build Lambda
      - run: sam build

      # Deploy Lambda + API Gateway + CloudFront
      # DiscordSetlistWebhookUrl 已於 2026-05-02 移轉至 yt-setlist-discord，故不傳入
      # ⚠️ --parameter-overrides 的續行序列中絕不可插入 `#` 註解：shell 會在該行結束續行，
      #    其後的參數變成獨立賦值語句、靜默不送出，SAM 對未 override 的參數則沿用 stack 現值
      - run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-site \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DbHost=${{ secrets.DB_HOST }} \
              DbPort=${{ secrets.DB_PORT }} \
              DbUser=${{ secrets.DB_USER }} \
              DbPassword=${{ secrets.DB_PASSWORD }} \
              DbName=${{ secrets.DB_NAME }} \
              YoutubeApiKey=${{ secrets.YOUTUBE_API_KEY }} \
              DiscordWebhookUrl=${{ secrets.DISCORD_WEBHOOK_URL }} \
              TriggerToken=${{ secrets.TRIGGER_TOKEN }} \
              LambdaMatcherUrl=${{ secrets.LAMBDA_MATCHER_URL }} \
              PubsubCallbackUrl=${{ secrets.PUBSUB_CALLBACK_URL }} \
              GithubToken=${{ secrets.GH_PAT_TOKEN }}

      # Get S3 bucket name and CloudFront distribution ID from stack outputs
      - name: Get stack outputs
        id: stack
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`FansiteBucketName`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"
          echo "cf_dist=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"

      # CDN 靜態快照（fansite/data/*.json）：首訪三層瀑布的第二層，內容取自剛部署完的正式 API
      # （刻意排在 sam build／deploy 之後：CodeUri 是 repo 根，先產快照會被打包進 Lambda；
      #   且部署後才抓 = 快照與新版 API 的輸出格式一致）。
      # continue-on-error——抓不完整就跳過下面的快照同步，S3 上既有的舊快照原地保留；
      # 快照過時只是首訪多校正幾個月份，擋住整個部署才是更糟的失敗模式
      - name: Build CDN snapshot
        id: snapshot
        continue-on-error: true
        run: npm run snapshot

      # Sync fansite static files to S3
      - name: Sync fansite to S3
        run: |
          aws s3 sync fansite/ s3://${{ steps.stack.outputs.bucket }}/ \
            --delete \
            --size-only \
            --cache-control "public, max-age=86400" \
            --exclude "node_modules/*" \
            --exclude "data/*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "*.scss" \
            --exclude "*.html" \
            --exclude "*.htm" \
            --exclude "*.md" \
            --exclude "nav.json" \
            --exclude "config.js" \
            --exclude "changelog.json"
          # 內容檔案用 no-cache（瀏覽器每次 revalidate，304 極快）；不用 --size-only
          # 以免同大小的內容變更被跳過（此組皆為小檔案，全量比對成本可忽略）
          aws s3 sync fansite/ s3://${{ steps.stack.outputs.bucket }}/ \
            --cache-control "no-cache, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.htm" \
            --include "*.md" \
            --include "nav.json" \
            --include "config.js" \
            --include "changelog.json" \
            --exclude "node_modules/*"

      # CDN 快照獨立一輪（上一輪已用 --exclude "data/*" 讓開，含 --delete 的刪除判定也不涉及它）：
      #   max-age=300  預設的 86400 會讓瀏覽器黏住舊快照一整天（CloudFront 端有
      #                invalidation，但瀏覽器沒有）；快照的意義就是「跟得上最近一次部署」
      #   不加 --size-only  月度快照常出現同大小的內容變更（改一個字），只比大小會漏傳
      #   --delete     清掉 manifest 已不存在的舊月份檔
      - name: Sync CDN snapshot to S3
        if: steps.snapshot.outcome == 'success'
        run: |
          aws s3 sync fansite/data/ s3://${{ steps.stack.outputs.bucket }}/data/ \
            --delete \
            --cache-control "public, max-age=300"

      # Invalidate CloudFront cache for updated files
      - name: Invalidate CloudFront
        run: |
          # 全路徑 invalidation：1 path/次（免費額度 1000/月），避免再有「新目錄忘了加清單」的遺漏
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist }} \
            --paths "/*"

  # 獨立 SAM stack：歌單模糊比對 Lambda（lambda/setlist-matcher）
  # 只在 matcher 或本 workflow 變更時部署
  deploy-matcher:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect matcher changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # push 事件 before..after 涵蓋整段推送範圍（而非僅 tip commit），
          # 避免多 commit 推送中，中間 commit 改了 matcher 卻因只比對 tip 被跳過部署
          # 注意：對完整 40 碼 hex，plain `--verify` 只驗語法不驗物件是否存在（git 已知行為，
          # 曾實測 deadbeef...×5 這種語法合法但不存在的 SHA 會被判定「verify 成功」）；
          # 需接 ^{commit} 強制檢查物件真實存在，否則 force-push 舊 tip 不可達等情境會漏判
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify -q "${BEFORE_SHA}^{commit}" > /dev/null 2>&1; then
            # before 不可用（新分支／force-push 等邊界情況）：安全預設視為有變更。
            # sam deploy 具冪等性，多部署一次無害；漏部署才是要消除的失敗模式。
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- lambda/setlist-matcher/ .github/workflows/deploy.yml 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'

      - uses: aws-actions/setup-sam@v2
        if: steps.changes.outputs.changed == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & deploy matcher
        if: steps.changes.outputs.changed == 'true'
        working-directory: lambda/setlist-matcher
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-setlist-matcher \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides BerrySiteApiUrl=https://d36w2d8blmdfr.cloudfront.net FunctionTimeout=29
