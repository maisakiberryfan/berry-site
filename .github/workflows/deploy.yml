name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.dev.vars'
      - 'wrangler.toml'

env:
  AWS_REGION: ap-northeast-1
  SAM_CLI_TELEMETRY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install dependencies and make esbuild available on PATH
      - run: |
          npm ci
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # Build Lambda
      - run: sam build

      # Deploy Lambda + API Gateway + CloudFront
      # DiscordSetlistWebhookUrl 已於 2026-05-02 移轉至 yt-setlist-discord，故不傳入
      # ⚠️ --parameter-overrides 的續行序列中絕不可插入 `#` 註解：shell 會在該行結束續行，
      #    其後的參數變成獨立賦值語句、靜默不送出，SAM 對未 override 的參數則沿用 stack 現值
      # ⚠️ Snapshot* 四個參數的值用 \" 包起來（→ 送出 `Key=""` 而非 `Key=`）：SAM CLI 的
      #    --parameter-overrides 解析器不接受未加引號的空值，會整個部署失敗；
      #    secrets 未設定時必須安全地落成空字串＝快照 cron skip（實測 1.151.0 行為）
      - run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-site \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DbHost=${{ secrets.DB_HOST }} \
              DbPort=${{ secrets.DB_PORT }} \
              DbUser=${{ secrets.DB_USER }} \
              DbPassword=${{ secrets.DB_PASSWORD }} \
              DbName=${{ secrets.DB_NAME }} \
              YoutubeApiKey=${{ secrets.YOUTUBE_API_KEY }} \
              DiscordWebhookUrl=${{ secrets.DISCORD_WEBHOOK_URL }} \
              TriggerToken=${{ secrets.TRIGGER_TOKEN }} \
              LambdaMatcherUrl=${{ secrets.LAMBDA_MATCHER_URL }} \
              PubsubCallbackUrl=${{ secrets.PUBSUB_CALLBACK_URL }} \
              GithubToken=${{ secrets.GH_PAT_TOKEN }} \
              SnapshotBucketA=\"${{ secrets.SNAPSHOT_BUCKET_A }}\" \
              SnapshotDistributionA=\"${{ secrets.SNAPSHOT_DISTRIBUTION_A }}\" \
              SnapshotBucketB=\"${{ secrets.SNAPSHOT_BUCKET_B }}\" \
              SnapshotDistributionB=\"${{ secrets.SNAPSHOT_DISTRIBUTION_B }}\"

      # Get S3 bucket name and CloudFront distribution ID from stack outputs
      - name: Get stack outputs
        id: stack
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`FansiteBucketName`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"
          echo "cf_dist=$(aws cloudformation describe-stacks --stack-name berry-site --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"

      # ── fansite-v2（v3 站）build → dist/ ──────────────────────────────────
      - name: Install fansite-v2 deps
        working-directory: fansite-v2
        run: npm ci

      # CDN 靜態快照（fansite-v2/public/data/*.json）：首訪三層瀑布的第二層。
      # 刻意排在 sam deploy 之後、Vite build 之前：部署後才抓＝快照與新版 API 的
      # 輸出格式一致；build 前抓＝Vite 把 public/ 連同 data/ 一起拷進 dist/。
      # continue-on-error——抓不完整就跳過下面的快照同步，S3 上既有的舊快照原地保留；
      # 快照過時只是首訪多校正幾個月份，擋住整個部署才是更糟的失敗模式
      - name: Snapshot data (best-effort)
        id: snapshot
        working-directory: fansite-v2
        continue-on-error: true
        run: npm run snapshot

      # history.md／changelog.json 用 repo 版覆蓋快照抓來的線上版：
      # 上一步是從 https://m-b.win 抓的，而此刻線上仍是「上一次部署」的內容
      # （本次的 S3 同步在下面才發生）→ 不覆蓋的話 /data/ 副本永遠落後一次部署，
      # 這兩支又是「這次 commit 才改的」機率最高的檔（history-bot／commit skill）。
      # 刻意不掛 snapshot 的 outcome 條件：這步只動 build 輸入，快照要不要上傳
      # 仍由下面的 `if: steps.snapshot.outcome == 'success'` 決定；mkdir -p 讓
      # snapshot 整支炸掉（public/data/ 沒建出來）時這步也不會再炸一次 CI
      - name: Overlay repo history/changelog into snapshot
        run: |
          mkdir -p fansite-v2/public/data
          cp fansite/pages/history.md fansite-v2/public/data/history.md
          cp fansite/changelog.json fansite-v2/public/data/changelog.json

      - name: Build fansite-v2
        working-directory: fansite-v2
        run: npm run build

      # Sync v3 static files to S3
      # ⚠️ 刻意「不」用全域 --delete：
      #   ① hash 資產只增不刪——Vite 內容 hash 檔名，開著舊分頁的使用者 lazy chunk
      #     不會 404；v2 遺產（assets/js|css|dist/）同樣落在保留路徑，
      #     切換觀察期滿後由清理 commit 一次出清（見 plan-v3-switchover）
      #   ② img/、pages/history.md、changelog.json 是 bucket 上必須保留的非 dist 內容
      #     （og:image／history-bot 持續 push／commit skill 更新），--delete 會誤刪
      - name: Sync fansite-v2 to S3
        run: |
          # hash 資產：內容不變 URL 就不變，--size-only 跳過已存在的同 hash 檔
          aws s3 sync fansite-v2/dist/assets/ s3://${{ steps.stack.outputs.bucket }}/assets/ \
            --size-only \
            --cache-control "public, max-age=31536000, immutable"
          # 頂層覆蓋檔（index.html／theme-init.js／favicon.ico）：no-cache 每次 revalidate
          # （304 極快）；不用 --size-only 以免同大小的內容變更被跳過
          aws s3 sync fansite-v2/dist/ s3://${{ steps.stack.outputs.bucket }}/ \
            --cache-control "no-cache, must-revalidate" \
            --exclude "assets/*" \
            --exclude "data/*"
          # v2 沿用內容（來源仍在 fansite/，v3 的 og:image 與快照 cron 靜態抓取都依賴）
          aws s3 sync fansite/img/ s3://${{ steps.stack.outputs.bucket }}/img/ \
            --size-only \
            --cache-control "public, max-age=86400"
          aws s3 cp fansite/pages/history.md s3://${{ steps.stack.outputs.bucket }}/pages/history.md \
            --cache-control "no-cache, must-revalidate"
          aws s3 cp fansite/changelog.json s3://${{ steps.stack.outputs.bucket }}/changelog.json \
            --cache-control "no-cache, must-revalidate"

      # CDN 快照獨立一輪（上一輪已用 --exclude "data/*" 讓開）：
      #   max-age=300  預設值會讓瀏覽器黏住舊快照一整天（CloudFront 端有
      #                invalidation，但瀏覽器沒有）；快照的意義就是「跟得上最近一次部署」
      #   不加 --size-only  月度快照常出現同大小的內容變更（改一個字），只比大小會漏傳
      #   --delete     清掉 manifest 已不存在的舊月份檔（僅限 data/ 前綴，安全）
      - name: Sync CDN snapshot to S3
        if: steps.snapshot.outcome == 'success'
        run: |
          aws s3 sync fansite-v2/dist/data/ s3://${{ steps.stack.outputs.bucket }}/data/ \
            --delete \
            --cache-control "public, max-age=300"

      # Invalidate CloudFront cache for updated files
      - name: Invalidate CloudFront
        run: |
          # 全路徑 invalidation：1 path/次（免費額度 1000/月），避免再有「新目錄忘了加清單」的遺漏
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_dist }} \
            --paths "/*"

  # 獨立 SAM stack：歌單模糊比對 Lambda（lambda/setlist-matcher）
  # 只在 matcher 或本 workflow 變更時部署
  deploy-matcher:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect matcher changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # push 事件 before..after 涵蓋整段推送範圍（而非僅 tip commit），
          # 避免多 commit 推送中，中間 commit 改了 matcher 卻因只比對 tip 被跳過部署
          # 注意：對完整 40 碼 hex，plain `--verify` 只驗語法不驗物件是否存在（git 已知行為，
          # 曾實測 deadbeef...×5 這種語法合法但不存在的 SHA 會被判定「verify 成功」）；
          # 需接 ^{commit} 強制檢查物件真實存在，否則 force-push 舊 tip 不可達等情境會漏判
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify -q "${BEFORE_SHA}^{commit}" > /dev/null 2>&1; then
            # before 不可用（新分支／force-push 等邊界情況）：安全預設視為有變更。
            # sam deploy 具冪等性，多部署一次無害；漏部署才是要消除的失敗模式。
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- lambda/setlist-matcher/ .github/workflows/deploy.yml 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'

      - uses: aws-actions/setup-sam@v2
        if: steps.changes.outputs.changed == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & deploy matcher
        if: steps.changes.outputs.changed == 'true'
        working-directory: lambda/setlist-matcher
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-s3 \
            --stack-name berry-setlist-matcher \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides BerrySiteApiUrl=https://d36w2d8blmdfr.cloudfront.net FunctionTimeout=29
