name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

# 最小權限：本 workflow 只需讀出原始碼（部署憑證走 CF token，不用 GITHUB_TOKEN）。
# 未宣告時 GITHUB_TOKEN 會沿用 repo 預設權限，可能是 read-write。
permissions:
  contents: read

# Workers 部署是「整份取代」，兩次併行只會讓後完成的那次勝出——而「後完成」不保證是
# 「後推送」。cancel-in-progress: true 直接掐掉舊的，最終狀態必定對應最新 commit
# （AWS 側因 CloudFormation／S3 的中途狀態問題刻意設 false，兩邊語意不同是有意的）。
concurrency:
  group: deploy-cf
  cancel-in-progress: true

# ⚠️ CF 憑證刻意「不」放頂層 env——頂層 env 會進每個 step 的行程環境，
# 連 npm ci／npm run build 都帶著部署 token，任一 devDep 被投毒即可讀走外傳
# （不經 GitHub log，secret 遮蔽機制擋不到）。只掛在真正需要的 wrangler deploy 那步。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 與 deploy.yml 一致的 '24'：兩支 workflow 都會跑 fansite-v2 的 npm ci／build，
      # Node 版本分歧＝同一份 lockfile 在兩條管線下解出不同的 optional binary
      # （esbuild/rollup 的平台包）與不同的引擎行為，AWS 綠、CF 紅這種差異最難查
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── fansite-v2（v3 站）build → dist/，即 wrangler.toml 的 [assets] directory ──
      # 沒有 cache-bust 步驟：Vite 產物是內容 hash 檔名（assets/index-<hash>.js），
      # 內容一變 URL 就變，不需要 ?v= query 這種手動破快取。
      - name: Install fansite-v2 deps
        working-directory: fansite-v2
        run: npm ci

      # CDN 快照層（public/data/*.json）——打的是 production 的公開唯讀 GET API
      # （https://m-b.win/api/...），不需要任何 secret。
      # continue-on-error：快照抓不完整不該擋部署——前端資料層是三層瀑布，
      # 缺快照只是首訪退回 API 校正（慢一點），比整站不部署好。
      # 注意 fetch-snapshot.mjs 單檔失敗會 exit 1，故這步在部分失敗時也會標紅但放行。
      - name: Snapshot data (best-effort)
        working-directory: fansite-v2
        continue-on-error: true
        run: npm run snapshot

      # history.md／changelog.json 用 repo 版覆蓋快照抓來的線上版（同 deploy.yml）：
      # 快照是從 https://m-b.win 抓的，那邊此刻仍是上一次部署的內容 → 不覆蓋的話
      # 備用站 /data/ 的沿革與更新紀錄永遠落後一次部署。
      # mkdir -p：snapshot 步驟是 continue-on-error，整支炸掉時 public/data/ 可能不存在
      - name: Overlay repo history/changelog into snapshot
        run: |
          mkdir -p fansite-v2/public/data
          cp fansite/pages/history.md fansite-v2/public/data/history.md
          cp fansite/changelog.json fansite-v2/public/data/changelog.json

      - name: Build fansite-v2
        working-directory: fansite-v2
        run: npm run build

      # 圖片/音訊併進 dist（同源方案）：備用站 build 不設 VITE_ASSET_BASE，
      # 圖片走相對路徑 /img/*——dist 內必須自帶。同源也讓 entry-worker.js 的
      # CSP（img-src/media-src 'self'）免改。/pages/history.md 與 changelog.json
      # 不需要——v3 從 /data/ 快照讀它們（上面 snapshot 步驟已產）。
      # 必須在 build 之後：vite build 會清空 dist/。
      # 用 `img/.` → `dist/img/`（而非 `img` → `dist/img`）：目標目錄若已存在，
      # 後者會拷成巢狀的 dist/img/img，圖片全部 404
      - name: Bundle site images into dist
        run: |
          mkdir -p fansite-v2/dist/img
          cp -r fansite/img/. fansite-v2/dist/img/

      # Install root dependencies
      - run: npm ci

      # Deploy to Cloudflare Workers（憑證只在這一步注入，見檔頭 env 註解）
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
