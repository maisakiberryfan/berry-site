name = "berry-site"
main = "entry-worker.js"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets — fansite 靜態檔案（備用站完整網站）
[assets]
directory = "fansite"
binding = "ASSETS"
# 預設行為是「請求命中靜態檔案就由資產伺服器直接回傳、完全不執行 worker」，
# 那條路徑上 entry-worker.js 的 security header 注入不會發生（實測：/ 與
# /assets/dist/tool.js 無任何 header，只有走 SPA fallback 的 /profile 有）。
# 設 true 讓所有請求都先進 worker，再由 worker 內的 env.ASSETS.fetch() 取檔並補 header。
run_worker_first = true

[observability]
enabled = true

# 生產環境變數
[vars]
MODE = "prod"
# Lambda URL for fuzzy matching
LAMBDA_MATCHER_URL = "https://y6fqnsu8od.execute-api.ap-northeast-1.amazonaws.com/Prod/match-setlist"

# Hyperdrive binding (DB 連線)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3794cb90bec64a1f9e92bc3b4a60ea41"  # mbdb (production)
localConnectionString = "postgresql://unused:unused@localhost:5432/unused"  # wrangler dev 用 .dev.vars DB_* 連線，此值僅避免啟動報錯

# Cron triggers — 備用站不跑 cron，由 AWS (EventBridge) 負責
# 正式啟用時取消註解
# [triggers]
# crons = ["0 7 * * *", "*/30 14-19 * * *"]

# --- 開發環境 ---
[env.dev]
name = "berry-site-dev"
main = "entry-worker.js"

[env.dev.assets]
directory = "fansite"
binding = "ASSETS"
run_worker_first = true

[env.dev.vars]
MODE = "test"
LAMBDA_MATCHER_URL = "http://localhost:3000/match-setlist"

# 需要使用 wrangler secret put 設定的秘密變數（清單須與 README 一致）：
# wrangler secret put YOUTUBE_API_KEY
# wrangler secret put DISCORD_WEBHOOK_URL
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put PUBSUB_CALLBACK_URL
# wrangler secret put GITHUB_TOKEN
# wrangler secret put TRIGGER_TOKEN   # webhook 簽名驗證與 /trigger-* 端點都依賴此值，未設＝不處理通知
