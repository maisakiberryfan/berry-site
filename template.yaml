AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Berry Site - VTuber fan site API (Hono on Lambda)

Globals:
  Function:
    Timeout: 180
    MemorySize: 256
    Runtime: nodejs24.x
    Architectures:
      - arm64

Parameters:
  DomainName:
    Type: String
    Default: m-b.win
  # 縮圖換圖後的 CloudFront invalidation 用。不能 !Ref CloudFrontDistribution：
  # Function→Distribution→HttpApi→Function 會循環引用，故以參數固定（id 非機密且不變）
  CfDistributionId:
    Type: String
    Default: E2J83LAK96PIJH
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: '3306'
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbName:
    Type: String
  YoutubeApiKey:
    Type: String
    NoEcho: true
  DiscordWebhookUrl:
    Type: String
    Default: ''
  # MIGRATED to yt-setlist-discord (2026-05-02): DiscordSetlistWebhookUrl removed
  # DiscordSetlistWebhookUrl:
  #   Type: String
  #   Default: ''
  TriggerToken:
    Type: String
    NoEcho: true
    Default: ''
  LambdaMatcherUrl:
    Type: String
    Default: 'https://y6fqnsu8od.execute-api.ap-northeast-1.amazonaws.com/Prod/match-setlist'
  PubsubCallbackUrl:
    Type: String
    Default: ''
  GithubToken:
    Type: String
    NoEcho: true
    Default: ''
  # CDN 快照 cron（src/cron-jobs/snapshot.js）的目標站台：bucket ＋ 該站的 distribution。
  # public repo 不寫死 bucket 名 → 由 CI secrets 傳入（deploy.yml）。
  # 留白＝該站台不處理；兩組都留白＝整個快照步驟 skip 並 log（向後安全）。
  # A＝現站（v2，fansite/data/ 由 CI 產、cron 保鮮）／B＝v3 站（demo 或切換後的新站）
  SnapshotBucketA:
    Type: String
    Default: ''
    Description: S3 bucket whose /data/ snapshot the cron refreshes (blank = skip)
  SnapshotDistributionA:
    Type: String
    Default: ''
    Description: CloudFront distribution to invalidate /data/* on (blank = no invalidation)
  SnapshotBucketB:
    Type: String
    Default: ''
  SnapshotDistributionB:
    Type: String
    Default: ''
  # CloudFront → API Gateway 的 origin 驗證共享值（隨機字串，由 CI secret 傳入）。
  # CloudFront 以 origin custom header `X-Origin-Verify` 附在每個 API origin request 上，
  # Lambda 據此確認「請求真的經過 CloudFront」→ 才敢信 XFF 倒數第二段＝訪客真實 IP
  # （限流 key，見 src/app.js 的 getRateLimitIp）。
  # 留白＝停用：header 不注入、限流退回 sourceIp，行為與導入前完全相同。
  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Shared secret CloudFront sends as X-Origin-Verify (blank = feature disabled)

Conditions:
  HasSnapshotA: !Not [!Equals [!Ref SnapshotBucketA, '']]
  HasSnapshotB: !Not [!Equals [!Ref SnapshotBucketB, '']]
  HasSnapshotDistA: !Not [!Equals [!Ref SnapshotDistributionA, '']]
  HasSnapshotDistB: !Not [!Equals [!Ref SnapshotDistributionB, '']]
  HasOriginVerify: !Not [!Equals [!Ref OriginVerifySecret, '']]

Resources:
  # --- Lambda Function ---
  BerryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: berry-api
      Handler: entry-lambda.handler
      Description: Berry Site unified API
      Environment:
        Variables:
          MODE: prod
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_NAME: !Ref DbName
          YOUTUBE_API_KEY: !Ref YoutubeApiKey
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          # MIGRATED to yt-setlist-discord (2026-05-02): DISCORD_SETLIST_WEBHOOK_URL removed
          # DISCORD_SETLIST_WEBHOOK_URL: !Ref DiscordSetlistWebhookUrl
          TRIGGER_TOKEN: !Ref TriggerToken
          LAMBDA_MATCHER_URL: !Ref LambdaMatcherUrl
          PUBSUB_CALLBACK_URL: !Ref PubsubCallbackUrl
          GITHUB_TOKEN: !Ref GithubToken
          THUMBNAIL_BUCKET: !Ref ThumbnailBucket
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CfDistributionId
          # `bucket:distributionId,bucket:distributionId`；未設定的組留下空段（如 `:`），
          # 由 snapshot.js 的 parseTargets 丟棄——故「參數留白＝該站台不處理」
          SNAPSHOT_TARGETS: !Sub "${SnapshotBucketA}:${SnapshotDistributionA},${SnapshotBucketB}:${SnapshotDistributionB}"
          # 空值＝限流的 XFF 真實 IP 識別停用（退回 sourceIp），見 src/app.js getRateLimitIp
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
      Policies:
        - Statement:
            # 縮圖上傳＋hash 比對（HeadObject 需 GetObject 權限）＋換圖後清 edge 快取
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${ThumbnailBucket.Arn}/*"
            - Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CfDistributionId}"
            # webhook 非同步化：self-invoke（固定函數名避免循環引用）
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:berry-api"
            # CDN 快照 cron：只寫 data/ 前綴（PutObject）＋清過期月份檔（DeleteObject），
            # ListBucket 限定 data/* 前綴。參數留白時整條 statement 不附掛（AWS::NoValue）
            - !If
              - HasSnapshotA
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${SnapshotBucketA}/data/*"
              - !Ref AWS::NoValue
            - !If
              - HasSnapshotA
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SnapshotBucketA}"
                Condition:
                  StringLike:
                    s3:prefix: "data/*"
              - !Ref AWS::NoValue
            - !If
              - HasSnapshotB
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${SnapshotBucketB}/data/*"
              - !Ref AWS::NoValue
            - !If
              - HasSnapshotB
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SnapshotBucketB}"
                Condition:
                  StringLike:
                    s3:prefix: "data/*"
              - !Ref AWS::NoValue
            - !If
              - HasSnapshotDistA
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SnapshotDistributionA}"
              - !Ref AWS::NoValue
            - !If
              - HasSnapshotDistB
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SnapshotDistributionB}"
              - !Ref AWS::NoValue
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BerryHttpApi
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BerryHttpApi
            Path: /
            Method: ANY
        # 排程一律以 Input 顯式指明要跑哪個工作（形狀同 warmup／snapshot 的 source 分流，
        # 另帶 job 供 handleCronTrigger 分派）。此前是「Lambda 端依 UTC 小時猜」——
        # 改了這裡的 cron 卻沒改 src/app.js 的小時判斷，工作就靜默不執行。
        # ⚠️ 帶 Input 之後 event 不再有 source=aws.events／detail-type，
        #    entry-lambda.js 的分流條件必須認得 source=cron（已加，且保留舊形狀）。
        DailyUpdate:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)
            Description: "Daily auto-update (UTC 07:00 = Taiwan 15:00)"
            Enabled: true
            Input: '{"source":"cron","job":"daily"}'
        PollingCheck:
          Type: Schedule
          Properties:
            Schedule: cron(0/10 14-19 * * ? *)
            Description: "Polling check every 10min (UTC 14-19 = Taiwan 22-03)"
            Enabled: true
            Input: '{"source":"cron","job":"polling"}'
        WarmUp:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: "Keep Lambda warm to avoid cold start"
            Enabled: true
            Input: '{"source":"warmup"}'
        # CDN 快照重產（src/cron-jobs/snapshot.js）：資料更新後 /data/*.json 就過期，
        # 前端雖有 API 背景校正兜底，首訪體感差。兩次／日各挑在資料變動剛落地之後。
        SnapshotAfterDailyUpdate:
          Type: Schedule
          Properties:
            Schedule: cron(30 7 * * ? *)
            Description: "Rebuild CDN snapshot (UTC 07:30 = Taiwan 15:30, after daily auto-update)"
            Enabled: true
            Input: '{"source":"snapshot"}'
        SnapshotAfterLiveHours:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 * * ? *)
            Description: "Rebuild CDN snapshot (UTC 20:00 = Taiwan 04:00, after last polling run at 19:50)"
            Enabled: true
            Input: '{"source":"snapshot"}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        # AWS SDK v3 為 Lambda runtime 內建，不打包（self-invoke 用）
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - entry-lambda.js

  # --- API Gateway HTTP API ---
  BerryHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${DomainName}"
          - !Sub "https://www.${DomainName}"
          - "http://localhost:8787"
          - "http://localhost:8788"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - If-None-Match
          - X-Source
          - X-Requested-With
        MaxAge: 600

  # --- S3 Bucket for CloudFront access logs ---
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "berry-cloudfront-logs-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30

  # --- S3 Bucket for Fansite static files ---
  FansiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "berry-fansite-${AWS::AccountId}"

  FansiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FansiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FansiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # --- S3 Bucket for Thumbnails ---
  ThumbnailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "berry-thumbnails-${AWS::AccountId}"

  ThumbnailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ThumbnailBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ThumbnailBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # --- CloudFront Function (bot blocker) ---
  BotBlockerFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: berry-bot-blocker
      AutoPublish: true
      FunctionConfig:
        Comment: "SPA route whitelist + bot blocking"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          var uriLower = uri.toLowerCase();
          // User-Agent blocklist for non-robots.txt-compliant bots (Bytespider, SEO scrapers)
          var uaHeader = event.request.headers['user-agent'];
          var ua = (uaHeader && uaHeader.value || '').toLowerCase();
          if (ua.indexOf('bytespider') >= 0 ||
              ua.indexOf('ahrefsbot') >= 0 ||
              ua.indexOf('semrushbot') >= 0 ||
              ua.indexOf('mj12bot') >= 0 ||
              ua.indexOf('dotbot') >= 0) {
            return { statusCode: 403, statusDescription: 'Forbidden', body: { encoding: 'text', data: '' } };
          }
          // /.well-known/*（ACME http-01 challenge、security.txt、apple-app-site-association…）
          // 是 RFC 8615 的標準路徑，必須在下面的 '/.' 前綴封鎖之前放行——否則憑證續期
          // 這類「平常用不到、要用時必須通」的流程會在最需要它的時候吃 404。
          // 白名單只開這一個前綴，其餘 dotfile（/.env、/.git/…）照樣擋。
          if (uriLower.startsWith('/.well-known/')) {
            return event.request;
          }
          if (uriLower.endsWith('.php') || uriLower.match(/\.php\d*$/) ||
              uriLower.startsWith('/wp-') || uriLower.startsWith('/wordpress/') ||
              uriLower.startsWith('/.') ||
              uriLower.startsWith('/phpinfo') || uriLower.startsWith('/_profiler') ||
              uriLower.startsWith('/themes/') || uriLower.startsWith('/modules/') ||
              uriLower.startsWith('/plugins/') || uriLower.startsWith('/includes/') ||
              uriLower.startsWith('/vendor/') || uriLower.startsWith('/cgi-bin/') || uriLower.startsWith('/cgi_bin/') ||
              uriLower === '/xmlrpc.php' || uriLower.startsWith('//xmlrpc') ||
              uriLower.startsWith('/admin') ||
              uriLower.startsWith('/joomla') || uriLower.startsWith('/drupal') ||
              uriLower.startsWith('/filemanager') || uriLower.startsWith('/tinyfilemanager') ||
              uriLower.startsWith('/@') ||
              uriLower.startsWith('/graphql') ||
              uriLower.startsWith('/login') || uriLower.startsWith('/register') ||
              uriLower.startsWith('/user/') ||
              uriLower.startsWith('/sftp') ||
              uriLower.startsWith('/stripe') || uriLower.startsWith('/sendgrid') ||
              uriLower.startsWith('/npm-debug') ||
              uriLower.endsWith('.log') ||
              // /api/* bot probes (not legit API paths — see src/app.js)
              uriLower === '/api/.env' || uriLower === '/api/env' ||
              uriLower === '/api/config' || uriLower === '/api/settings' ||
              uriLower === '/api/credentials' ||
              uriLower === '/api/swagger' || uriLower === '/api/swagger.json' ||
              uriLower === '/api/graphql' || uriLower === '/api/gql' ||
              uriLower.startsWith('/api/v1/') || uriLower.startsWith('/api/v2/')) {
            return { statusCode: 404, statusDescription: 'Not Found', body: { encoding: 'text', data: '' } };
          }
          // SPA routes -> rewrite to /index.html（或該路徑專屬的 OG 快照）
          // 新增前端頁面時必須同步這個陣列（清單真相：fansite-v2/src/router.svelte.js 的
          // ROUTES；另有 App.svelte 的 PAGES 與 entry-worker.js 的 SPA_ROUTES）。
          // 陣列元素一律小寫，比對前把路徑轉小寫：URL 路徑大小寫敏感，`/SetList` 原本
          // 不會被 rewrite → 直接吃 S3 的 404（站內點得到、手打網址卻壞掉）。
          var spaRoutes = ['/', '/profile', '/history', '/clothes', '/discography', '/songlist', '/streamlist', '/setlist', '/aliases', '/analytics'];
          // 動態段路由（詳細頁 path 化）：/clothes/<日期>、/discography/<作品id>。
          // 前綴命中就一定 rewrite 成站內 HTML —— 認不得的 id 也要拿到 SPA 殼，
          // 否則直接落到 S3（OAC 無 ListBucket）＝一頁 403 AccessDenied 的 XML。
          var spaPrefixes = ['/clothes', '/discography'];
          // ── OG 快照（per-page 分享預覽）─────────────────────────────────────
          // fansite-v2/scripts/generate-og-html.mjs 產的 /og/<slug>.html＝index.html
          // 只換 meta 的副本，所以「所有訪客都拿它」是安全的（一般瀏覽毫無差別），
          // 也讓快取鍵維持單一——若改成只對爬蟲 UA 送 og，CachingOptimized 不含 UA，
          // 先到的那份會被快取給所有人，等於隨機二選一。
          // ⚠️ 這裡的 id 清單是**必要之惡**：CloudFront Function 無法得知 S3 上有沒有
          //    對應物件，一律機械式 rewrite 的話，不存在的 id 會變成 403/404 錯誤頁。
          //    漏更新的代價只是「該項目退回站台級預覽」（仍是正常網頁），
          //    與 spaRoutes 漏更新的硬壞不同。一致性檢查：
          //    cd fansite-v2 && npm run check:routes（清單真相＝各頁的資料模組）
          var ogPages = ['/discography', '/clothes', '/profile', '/setlist'];
          var ogClothes = '|20260611|20260212|20250526|20250120|20241205|20240617|20240116|20230905|20230515|20220905|20220815|20220515|20210910|20210724|20210213|20200815|';
          var ogDisco = '|rebirthr|lucisphere|reverser|animania|eee|peace|bbb|serve|bouquet|strawberry-garden|itsumo-doori|kisetsu-no-hohaba|happy-likey|towalove|genjitsu|drop-note|happy-story|love-letter|niji-no-mukougawa|tasting-my-love|kakurenbo|';
          var clean = (uri.replace(/\/$/, '') || '/').toLowerCase();
          if (spaRoutes.indexOf(clean) >= 0) {
            event.request.uri = ogPages.indexOf(clean) >= 0 ? '/og' + clean + '.html' : '/index.html';
            return event.request;
          }
          var cut = clean.indexOf('/', 1);
          if (cut > 0) {
            var prefix = clean.slice(0, cut);
            var rest = clean.slice(cut + 1);
            if (rest && rest.indexOf('/') < 0 && spaPrefixes.indexOf(prefix) >= 0) {
              var list = '';
              var itemId = rest;
              if (prefix === '/clothes') {
                // /clothes/20260611-3（直開第 3 張立繪）與舊版 _s 後綴都屬於同一套衣裝
                itemId = rest.split('-')[0].replace(/_s$/, '');
                list = ogClothes;
              } else if (prefix === '/discography') {
                list = ogDisco;
              }
              event.request.uri = list.indexOf('|' + itemId + '|') >= 0
                ? '/og' + prefix + '-' + itemId + '.html'
                : '/index.html';
              return event.request;
            }
          }
          return event.request;
        }

  # --- CloudFront Distribution ---
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: berry-fansite-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 靜態內容（S3Origin）的 security header。
  # CSP 值與 entry-worker.js 的 CSP 常數**必須逐字一致**（2026-07-26 灰度收斂完成，
  # 兩側均為正式 enforce），各 source 的依據見 entry-worker.js 的註解。
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Security headers for fansite static content
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions:
            Override: true          # → X-Content-Type-Options: nosniff
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000   # 1 年
            # IncludeSubdomains 先不開：會連帶把 sqldata.m-b.win / bus.m-b.win 等
            # 所有子網域鎖成 https，且瀏覽器端無法即時回退，需另行確認後再啟用
            IncludeSubdomains: false
            Preload: false
            Override: true
          XSSProtection:
            # false → X-XSS-Protection: 0（現代建議值：關閉舊版 XSS auditor，防護交給 CSP）
            Protection: false
            Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Comment: !Sub "Berry Site - ${DomainName}"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:495219733379:certificate/086af653-fef6-466c-af06-655cf7f590a3
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          IncludeCookies: false
          Prefix: cf-logs/

        Origins:
          # S3 origin (fansite static files)
          - Id: S3Origin
            DomainName: !GetAtt FansiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

          # S3 origin (thumbnails)
          - Id: ThumbnailOrigin
            DomainName: !GetAtt ThumbnailBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

          # API Gateway origin
          # OriginCustomHeaders：CloudFront 在每個送往此 origin 的請求附上 X-Origin-Verify，
          # 且會**覆寫** viewer 自帶的同名 header ⇒ Lambda 憑此判定請求確實經過 CloudFront，
          # 才採信 XFF 倒數第二段為訪客真實 IP（限流 key，見 src/app.js getRateLimitIp）。
          # 參數留白時整個 OriginCustomHeaders 不出現（AWS::NoValue）＝功能停用、行為不變。
          - Id: ApiOrigin
            DomainName: !Sub "${BerryHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginCustomHeaders: !If
              - HasOriginVerify
              - - HeaderName: X-Origin-Verify
                  HeaderValue: !Ref OriginVerifySecret
              - !Ref AWS::NoValue
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BotBlockerFunction.FunctionARN

        CacheBehaviors:
          # Thumbnails → ThumbnailBucket (cached)
          - PathPattern: /tb/*
            TargetOriginId: ThumbnailOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          # All data API routes under /api/* → API Gateway (no cache)
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt BotBlockerFunction.FunctionARN
          # Infrastructure routes (no /api/ prefix)
          - PathPattern: /health
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
          - PathPattern: /webhook/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          - PathPattern: /trigger-*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${BerryHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for DNS CNAME)
    Value: !Ref CloudFrontDistribution
  FansiteBucketName:
    Description: S3 bucket for fansite static files
    Value: !Ref FansiteBucket
  ThumbnailBucketName:
    Description: S3 bucket for stream thumbnails
    Value: !Ref ThumbnailBucket
