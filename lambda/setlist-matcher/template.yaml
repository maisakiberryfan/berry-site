AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Berry Setlist Matcher - Fuzzy matching service for setlist parsing

Parameters:
  FunctionTimeout:
    Type: Number
    Default: 29
    Description: Lambda function timeout in seconds
  FunctionMemory:
    Type: Number
    # 1769MB = 1 vCPU 全額（Lambda 的 CPU 依記憶體線性配給）。fuzzy 比對是純 CPU、
    # 單執行緒，512→1769 讓 wall time 降約 3 倍而 GB-s 大致持平（跑得快抵掉單價高），
    # 解掉 maxLines=500 的最壞情況撞破 29s 的問題
    Default: 1769
    Description: Lambda function memory in MB (1769 = 1 full vCPU)
  BerrySiteApiUrl:
    Type: String
    Default: 'https://d36w2d8blmdfr.cloudfront.net'
    Description: Berry Site API base URL for songlist/aliases data

Globals:
  Function:
    Timeout: !Ref FunctionTimeout
    MemorySize: !Ref FunctionMemory
    Runtime: nodejs24.x
    Architectures:
      - arm64

Resources:
  MatchSetlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: berry-setlist-matcher
      Handler: src/handler.handler
      CodeUri: .
      Environment:
        Variables:
          BERRY_SITE_API_URL: !Ref BerrySiteApiUrl
      Events:
        MatchSetlist:
          Type: Api
          Properties:
            Path: /match-setlist
            Method: post
        MatchSetlistOptions:
          Type: Api
          Properties:
            Path: /match-setlist
            Method: options

  MatchSetlistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MatchSetlistFunction}
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/match-setlist"
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt MatchSetlistFunction.Arn
