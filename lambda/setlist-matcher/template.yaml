AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Berry Setlist Matcher - Fuzzy matching service for setlist parsing

Parameters:
  FunctionTimeout:
    Type: Number
    Default: 29
    Description: Lambda function timeout in seconds
  FunctionMemory:
    Type: Number
    # 1769MB = 1 vCPU 全額（Lambda 的 CPU 依記憶體線性配給）。fuzzy 比對是純 CPU、
    # 單執行緒，512→1769 讓 wall time 降約 3 倍而 GB-s 大致持平（跑得快抵掉單價高），
    # 解掉 maxLines=500 的最壞情況撞破 29s 的問題
    Default: 1769
    Description: Lambda function memory in MB (1769 = 1 full vCPU)
  BerrySiteApiUrl:
    Type: String
    Default: 'https://d36w2d8blmdfr.cloudfront.net'
    Description: Berry Site API base URL for songlist/aliases data
  MatcherSharedSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Shared secret callers must send as X-Matcher-Secret (blank = no check)

Globals:
  # 端點網址在公開 repo 裡，節流是費用的兜底上限（密鑰沒設時尤其重要）：
  # 正常用量是一場直播一次呼叫、序列執行，遠低於每秒 1 次；超過的回 429，主站下次輪詢會重試
  Api:
    MethodSettings:
      - ResourcePath: '/*'
        HttpMethod: '*'
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 5
  Function:
    Timeout: !Ref FunctionTimeout
    MemorySize: !Ref FunctionMemory
    Runtime: nodejs24.x
    Architectures:
      - arm64

Resources:
  MatchSetlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: berry-setlist-matcher
      Handler: src/handler.handler
      CodeUri: .
      Environment:
        Variables:
          BERRY_SITE_API_URL: !Ref BerrySiteApiUrl
          # 空值＝不驗證呼叫者（見 src/handler.js 的 isAuthorized）
          MATCHER_SHARED_SECRET: !Ref MatcherSharedSecret
      Events:
        MatchSetlist:
          Type: Api
          Properties:
            Path: /match-setlist
            Method: post
        MatchSetlistOptions:
          Type: Api
          Properties:
            Path: /match-setlist
            Method: options

  MatchSetlistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MatchSetlistFunction}
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/match-setlist"
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt MatchSetlistFunction.Arn
